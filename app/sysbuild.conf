# SPDX-License-Identifier: Apache-2.0
#
# Sysbuild configuration of the board build (west build --sysbuild): MCUboot in
# boot_partition, the signed application in slot0_partition, serial recovery on
# USART2 (docs/firmware-update.md). native_sim builds do not use sysbuild.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# One application slot: serial recovery writes slot 0 directly.
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y

# Signature: sysbuild default (RSA-2048) with the MCUboot development key, which
# is public and only fit for development. Own key: SB_CONFIG_BOOT_SIGNATURE_KEY_FILE.
