#
# Doppelstep application configuration, common to every board. Board-specific
# options: boards/<board>.conf (merged by Zephyr automatically).

# --- Libraries (glue in modules/) --------------------------
# The power stage node of the devicetree selects the topology of Stepper-C
# (modules/stepper-c/Kconfig): only the one the board uses is built.
# The motor node sets no stall time: the stall detection of Stepper-C is not used
CONFIG_SSTEP_STALL=n

CONFIG_X430_MODEL_XM430_W350=y
CONFIG_X430_MAX_DEVICES=1
CONFIG_X430_SIMULATOR=n
# DYNAMIXEL Wizard 2.0 reads the whole XM430 Control Table (addresses 0..661) in
# one READ of 662 bytes: status packet 673 bytes before byte stuffing. 256 bytes
# (default) allowed reads up to 245 bytes, and the Wizard showed TIME OUT.
# 768 leaves 95 bytes for stuffing. Two buffers of this size are in RAM (in
# x430_servo_data): the receive buffer of DXL2-C, in which it also decodes the
# packet (DXL2-C 2.0.0), and the status packet the X430 bus builds in place.
CONFIG_X430_DXL2_MAX_PACKET_SIZE=768
# Voltage limit ranges above the 16 V of an XM430 (the board runs at 24 V)
CONFIG_X430_MODEL_OVERRIDES="x430_overrides.yaml"

# --- STATUS LED --------------------------------------------------------------
CONFIG_GPIO=y

# --- Persistent EEPROM area of the emulated DYNAMIXEL ------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Logging -----------------------------------------------------------------
CONFIG_LOG=y
# No log prints a float. Without it picolibc links printf without floating point
# (the double printf with its Ryu tables was about 5 KiB of flash).
CONFIG_CBPRINTF_FP_SUPPORT=n
# Minimal logging: each message is printed at once through printk on the console
# of the board, in the context of the caller, without the deferred log thread,
# its buffer and the log backends (about 9.8 KB of flash and 2.3 KB of RAM on the
# full-bridge board). No timestamps, no colors. native_sim keeps its immediate
# mode (boards/native_sim_native_64.conf).
CONFIG_LOG_MODE_MINIMAL=y
# Small printf core: the logs use only %d, %u, %ld, %x with width, %c and %s
# (about 0.7 KB)
CONFIG_CBPRINTF_NANO=y
# No "*** Booting Zephyr OS ***" line: main.c logs "Doppelstep <version> on
# <board>" (about 1.2 KB)
CONFIG_BOOT_BANNER=n

# --- Debugging: thread awareness for OpenOCD / J-Link / gdb ------------------
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=2048
