#
# Doppelstep on native_sim/native/64: the firmware as a Linux program, the
# simulated motor (sfs,sim-power-stage in the overlay), the DYNAMIXEL bus
# on a pseudoterminal (uart1). Merged with prj.conf.

# 1 ms tick = slow-loop period; the simulation backend runs the 20 fast-loop
# periods (20 kHz PWM of the ESC1) of each tick in one timer expiry
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Logs on stdout of the program
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LOG_MODE_IMMEDIATE=y
