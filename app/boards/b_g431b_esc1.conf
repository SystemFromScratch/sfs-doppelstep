#
# Doppelstep on B-G431B-ESC1 (merged with prj.conf).

# --- Cortex-M4F: FPU in threads and in the fast-loop interrupt ---------------
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Fast loop (ADC end of sequence) above the kernel's interrupt locking
CONFIG_ZERO_LATENCY_IRQS=y

# --- Peripherals -------------------------------------------------------------
CONFIG_OPAMP=y

# IWDG, fed only while every task runs (app/src/supervisor.h)
CONFIG_WATCHDOG=y

# NVS erases and writes the internal flash
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- Console and logging over RTT (USART2 is the DYNAMIXEL bus) --------------
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Minimal logging (prj.conf) has no log backends: printk writes to this console.
# It prints in the caller, also in the control task: when
# the RTT buffer is full, drop the characters instead of waiting for the host
# (the default waits up to 2 x 2 ms with a debugger attached).
CONFIG_RTT_TX_RETRY_CNT=0
