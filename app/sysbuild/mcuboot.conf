#
# MCUboot of the board build, merged with the prj.conf of MCUboot: serial
# recovery (SMP) on USART2 (docs/firmware-update.md).

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# No button: the board enters serial recovery through the wait window below
# or when slot 0 holds no valid image.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

# Every reset: wait 500 ms for an SMP command, then start the application.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=500

# No valid image in slot 0 (for example after an interrupted upload): stay in
# serial recovery.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# 32 KiB of SRAM: MCUboot checks the image with one public key, so 2 PSA key
# slots instead of 16 (about 8 KiB less RAM).
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=2

# USART2 carries SMP: no console on it (as serial_recovery.conf of MCUboot).
# Logging stays configured as in the prj.conf of MCUboot, but off: without a
# console it has no output, and the messages would only take flash.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
