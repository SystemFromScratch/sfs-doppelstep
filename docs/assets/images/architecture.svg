<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="Doppelstep architecture: from the host to the motor">
<title>Doppelstep architecture: from the host to the motor</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B9A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="0" y="0" width="1000" height="760" rx="12" fill="#FFFFFF"/>
<rect x="40" y="24" width="340" height="66" rx="10" fill="#F2F5FA" stroke="#5A6472" stroke-width="1.5"/>
<text x="210.0" y="46.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#0B2545" text-anchor="middle">Host PC</text>
<text x="210.0" y="66.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">ROS 2 · DynamixelSDK · DYNAMIXEL Wizard</text>
<rect x="20" y="140" width="960" height="480" rx="14" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="2"/>
<text x="300" y="166" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E5AA8" text-anchor="start">Firmware on Zephyr RTOS v4.5.0</text>
<line x1="155" y1="90" x2="155" y2="188" stroke="#0B2545" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="167" y="120" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B2545" text-anchor="start">DYNAMIXEL Protocol 2.0, 1 Mbps, UART</text>
<text x="960" y="166" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="end">application (app/) in blue · drivers (drivers/) in teal</text>
<rect x="40" y="190" width="230" height="104" rx="10" fill="#E6F4F5" stroke="#0F8B9A" stroke-width="1.5"/>
