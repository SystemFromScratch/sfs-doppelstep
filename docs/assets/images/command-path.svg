<text x="470" y="53" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1E5AA8" text-anchor="middle">joint_bridge</text>
<text x="470" y="72" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">comm_task</text>
