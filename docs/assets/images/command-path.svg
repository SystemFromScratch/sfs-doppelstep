<rect x="610" y="30" width="160" height="54" rx="10" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="1.8"/>
<text x="690" y="53" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#1E5AA8" text-anchor="middle">control_task</text>
