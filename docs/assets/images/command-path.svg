<text x="580.0" y="399" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B2545" text-anchor="middle">result, sequence number ← rsp_q</text>
<rect x="375" y="420" width="190" height="46" rx="6" fill="#F2F5FA" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="470" y="439" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E5AA8" text-anchor="middle">late answer? discarded</text>
<text x="470" y="455" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#1E5AA8" text-anchor="middle">by its sequence number</text>
<line x1="470" y1="490" x2="276" y2="490" stroke="#0B2545" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="370.0" y="483" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B2545" text-anchor="middle">result (0 or −errno)</text>
<line x1="270" y1="530" x2="96" y2="530" stroke="#0B2545" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="180.0" y="523" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0B2545" text-anchor="middle">status packet: OK or Result Fail</text>
<text x="890" y="470" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F8B9A" text-anchor="middle">fast loop keeps running</text>
<text x="890" y="488" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#0F8B9A" text-anchor="middle">in the 20 kHz interrupt</text>
