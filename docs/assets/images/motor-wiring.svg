<text x="390.0" y="499.0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">VBUS 10–28 V, nominal 24 V</text>
