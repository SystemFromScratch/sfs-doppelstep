<path d="M562,160 L705,160" stroke="#1B1B1B" stroke-width="3" fill="none"/>
<path d="M562,275 L594,275 A6,6 0 0 1 606,275 L705,275" stroke="#C62828" stroke-width="3" fill="none"/>
<path d="M562,390 L600,390 L600,225 L705,225" stroke="#2E7D32" stroke-width="3" fill="none"/>
<path d="M600,390 L630,390 L630,340 L705,340" stroke="#1565C0" stroke-width="3" fill="none"/>
<circle cx="600" cy="390" r="5" fill="#0B2545"/>
<text x="615" y="152" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B1B1B" text-anchor="start">black</text>
<text x="615" y="267" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#C62828" text-anchor="start">red</text>
<text x="640" y="217" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="end">green</text>
<text x="640" y="332" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1565C0" text-anchor="start">blue</text>
<text x="660" y="490" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0B2545" text-anchor="start">Coil A: U to W. Coil B: V to W.</text>
<text x="660" y="508" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">W is the shared leg: it carries iA + iB,</text>
<text x="660" y="526" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">up to √2 × the phase current.</text>
<text x="660" y="544" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">Lead colours from the motor datasheet: check</text>
<text x="660" y="562" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">the pairs with an ohmmeter (≈ 1.6 Ω in a coil,</text>
<text x="660" y="580" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="start">open between the coils).</text>
<text x="660" y="598" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E07A00" text-anchor="start">A reversed coil flips its current sign:</text>
<text x="660" y="616" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#E07A00" text-anchor="start">bring-up step 3 checks it.</text>
