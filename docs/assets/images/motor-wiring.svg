<text x="145" y="590" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#2E7D32" text-anchor="start">DYNAMIXEL bus, SWD, RTT log</text>
