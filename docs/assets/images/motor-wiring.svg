<text x="390" y="422" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#5A6472" text-anchor="middle">OPAMP3 → PB1, ADC1_IN12</text>
