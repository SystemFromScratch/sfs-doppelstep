<text x="815" y="118" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">2.0 A · 1.6 Ω · 3.0 mH per coil · 200 steps/rev</text>
