<path d="M710,275 L740,275 L740,285 a5.625,5.625 0 0 1 0,11.25 a5.625,5.625 0 0 1 0,11.25 a5.625,5.625 0 0 1 0,11.25 a5.625,5.625 0 0 1 0,11.25 L740,340 L710,340" stroke="#0B2545" stroke-width="2.2" fill="none"/>
<text x="760" y="197" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B2545" text-anchor="start">coil A</text>
<text x="760" y="312" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" fill="#0B2545" text-anchor="start">coil B</text>
<circle cx="890" cy="250" r="52" fill="#F2F5FA" stroke="#5A6472" stroke-width="1.6"/>
<text x="890" y="255" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A6472" text-anchor="middle">rotor</text>
<circle cx="710" cy="160" r="5" fill="#FFFFFF" stroke="#0B2545" stroke-width="2"/>
<text x="700" y="151" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0B2545" text-anchor="end">A+</text>
<circle cx="710" cy="225" r="5" fill="#FFFFFF" stroke="#0B2545" stroke-width="2"/>
<text x="700" y="216" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0B2545" text-anchor="end">A−</text>
