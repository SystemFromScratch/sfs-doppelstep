# SPDX-License-Identifier: Apache-2.0
#
# Documentation website and PDF manual on GitHub Pages:
#   https://systemfromscratch.github.io/sfs-doppelstep/
#   https://systemfromscratch.github.io/sfs-doppelstep/Doppelstep.pdf
#
# Every pull request builds both (strict MkDocs: a broken link or anchor fails);
# a push to main also publishes them. One-time repository setting:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Website and PDF manual
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # git describe: version on the PDF cover

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Python packages and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Website and PDF manual
        run: python tools/docs/build_pdf.py --browser chromium

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
