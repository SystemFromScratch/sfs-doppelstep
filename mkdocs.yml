# MkDocs configuration of the Doppelstep documentation.
#
#   HTML preview:  mkdocs serve
#   HTML site:     mkdocs build                     (output: site/)
#   PDF manual:    python tools/docs/build_pdf.py   (output: site/Doppelstep.pdf)
#
# Dependencies: requirements.txt. VS Code: tasks "Docs: Serve" and
# "Docs: Build PDF" (docs/development.md).

site_name: Doppelstep
site_description: >-
  Zephyr RTOS firmware for the STMicroelectronics B-G431B-ESC1 that drives a
  two-phase stepper motor with Stepper-C and answers on the bus as a DYNAMIXEL
  XM430-W350 (Protocol 2.0).
site_author: Anton Vynohradov
repo_url: https://github.com/SystemFromScratch/sfs-doppelstep
edit_uri: ""

docs_dir: docs
site_dir: site
strict: true

exclude_docs: |
  design/
  superpowers/

nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Porting to a new MCU family: porting.md
  - Development environment: development.md
  - Firmware update: firmware-update.md
  - Simulated motor: simulation.md
  - Tests: testing.md
  - Hardware checklist: hardware-checklist.md
  - GUI: gui/index.md
  - Naming: NAMING.md

theme:
  name: material
  language: en
  font: false            # system fonts: no download needed for offline/PDF builds
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

# Shown on the PDF cover page. tools/docs/build_pdf.py sets both variables
# (git describe and today's date); plain `mkdocs build` uses the defaults.
extra:
  doc_version: !ENV [DPS_DOCS_VERSION, "development snapshot"]
  doc_date: !ENV [DPS_DOCS_DATE, ""]

extra_css:
  - assets/stylesheets/print.css

hooks:
  - tools/docs/hooks.py      # captioned figures from plain Markdown images

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Contents
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # Must be the last plugin: it combines all pages into site/print_page/,
  # which tools/docs/build_pdf.py prints to PDF.
  - print-site:
      add_to_navigation: false
      print_page_title: Doppelstep
      add_cover_page: true
      cover_page_template: tools/docs/cover_page.tpl
      add_table_of_contents: true
      toc_title: Table of contents
      toc_depth: 4
      enumerate_headings: true
      enumerate_figures: true
      add_full_urls: false
      add_print_site_banner: false
