# MkDocs configuration of the Doppelstep documentation.
#
#   HTML preview:  mkdocs serve
#   HTML site:     mkdocs build                       (output: site/)
#   PDF manual:    python tools/docs/build_manual.py  (output: site/Doppelstep.pdf,
#                                                      settings: extra.manual below)
#   Diagrams:      python tools/docs/diagrams.py      (docs/assets/images/*.svg)
#
# Dependencies: requirements.txt. VS Code: tasks "Docs: Serve" and
# "Docs: Build PDF" (docs/development.md).
#
# The landing page (docs/index.md, template overrides/home.html) is driven by
# extra.landing below. Every number on it is measured on this version of the
# code: re-measure after a change (docs/testing.md, the build log of CI).

site_name: Doppelstep
site_description: >-
  Open-source Zephyr RTOS firmware that drives a two-phase stepper motor in
  closed-loop microstepping current control on the STMicroelectronics
  B-G431B-ESC1 and answers on the bus as a DYNAMIXEL XM430-W350 smart servo
  (Protocol 2.0), tested on the PC with a simulated motor.
site_author: Anton Vynohradov
site_url: https://systemfromscratch.github.io/sfs-doppelstep/
repo_url: https://github.com/SystemFromScratch/sfs-doppelstep
repo_name: SystemFromScratch/sfs-doppelstep
edit_uri: ""
copyright: >-
  Copyright &copy; 2026 Anton Vynohradov ·
  <a href="https://systemfromscratch.com/">SystemFromScratch®</a> ·
  Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License 2.0</a>

docs_dir: docs
site_dir: site
strict: true
validation:
  anchors: warn          # a link to a missing #section fails the strict build

exclude_docs: |
  design/
  superpowers/

nav:
  - Home: index.md
  - Guide:
      - Introduction: overview.md
      - Technology stack: technology.md
      - Getting started: getting-started.md
      - Hardware and bring-up: hardware.md
      - Dead time of the power stage: dead-time.md
      - Protection: protection.md
      - DYNAMIXEL emulation: dynamixel.md
      - Configuration: configuration.md
  - How It Works:
      - Architecture: architecture.md
      - Simulated motor: simulation.md
      - Firmware update: firmware-update.md
      - Porting to a new MCU family: porting.md
  - Development:
      - Development environment: development.md
      - Tests and CI: testing.md
      - Hardware checklist: hardware-checklist.md
      - GUI: gui/index.md
  - About:
      - Author & Company: about.md
      - Naming: NAMING.md
      - License: license.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/brand/systemfromscratch-logo-on-dark.png
  favicon: assets/images/brand/systemfromscratch-logo.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  generator: false
  # Header download button (overrides/partials/header.html). The PDF is written
  # next to the site by tools/docs/build_manual.py (site/Doppelstep.pdf, CI:
  # .github/workflows/docs.yml), so it is missing under `mkdocs serve`.
  manual_pdf: Doppelstep.pdf
  # ---------------------------------------------------------------- PDF manual
  # Read by tools/docs/build_manual.py (WeasyPrint): cover, imprint, contents,
  # numbered chapters in nav order, the About pages unnumbered, the license as an
  # appendix. Version: the latest vX.Y.Z tag, otherwise `git describe`.
  manual:
    title: Doppelstep
    subtitle: Your stepper motor, seen as a DYNAMIXEL smart servo
    eyebrow: Open-source Zephyr RTOS firmware
    product: firmware
    website: systemfromscratch.github.io
    output: site/Doppelstep.pdf
    cover_image: assets/images/hero-3d.svg
    appendices: [license.md]
    unnumbered: [about.md, NAMING.md]
    web_only: [index.md]
    keywords: >-
      Zephyr RTOS, stepper motor, microstepping, current control, DYNAMIXEL Protocol 2.0,
      XM430-W350, B-G431B-ESC1, STM32G431, MCUboot, ROS 2
    vendor_trademarks: >-
      DYNAMIXEL and ROBOTIS are trademarks of ROBOTIS Co., Ltd. STM32 is a registered
      trademark of STMicroelectronics International N.V. Arm and Cortex are trademarks of
      Arm Limited. Hardware and protocol names are used only to describe compatibility;
      Doppelstep is not affiliated with or endorsed by their owners.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AntonVynohradov
      name: Anton Vynohradov on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vynohradov
      name: Anton Vynohradov on LinkedIn
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0005-6965-0911
      name: Anton Vynohradov on ORCID
    - icon: material/web
      link: https://systemfromscratch.com/
      name: SystemFromScratch®

  # ---------------------------------------------------------------- landing page
  # Rendered by overrides/home.html: hero -> the problem (3 problem->solution
  # cards) -> what you get (6 linked cards) -> measured stats -> quick start
  # (docs/index.md) -> SystemFromScratch® portfolio banner.
  landing:
    eyebrow: Open-source Zephyr RTOS firmware
    title: Your stepper
    accent: seen as a smart servo
    lead: >-
      Doppelstep turns a two-phase stepper motor and a small STM32 motor-control board
      into a joint that answers on the bus as a DYNAMIXEL XM430-W350, in position, extended
      position and velocity mode. Closed-loop microstepping current control at 20 kHz,
      protection down to the hardware, a signed bootloader, and the whole firmware tested
      on a PC before it reaches the hardware.
    hero_image: assets/images/hero-3d.svg
    hero_alt: >-
      Isometric scene: DYNAMIXEL Protocol 2.0 packets from a ROS 2 host reach a controller
      board running Doppelstep on Zephyr RTOS; three half-bridges drive a stepper motor
      with a servo horn through two phase currents 90 degrees apart.
    buttons:
      - {text: Try it without hardware, link: getting-started/, style: primary}
      - {text: View on GitHub, link: "https://github.com/SystemFromScratch/sfs-doppelstep", style: outline}
    features:
      - {icon: layers, line1: Zephyr RTOS 4.5, line2: drivers & devicetree}
      - {icon: bus, line1: DYNAMIXEL, line2: Protocol 2.0}
      - {icon: monitor, line1: Runs on a PC, line2: simulated motor}
      - {icon: code, line1: Apache-2.0, line2: open source}
    problem:
      eyebrow: The problem
      title: A smart-servo joint from a stepper motor
      intro: >-
        Robot arms such as OpenMANIPULATOR-X are built from smart servos that a ROS 2 host
        drives over DYNAMIXEL Protocol 2.0. A two-phase stepper motor is a common, low-cost
        alternative with a high holding torque, but on its own it speaks no protocol and
        needs a current controller that runs tens of thousands of times per second. The
        firmware has to close that gap on one small microcontroller (Cortex-M4, 128 KiB of
        flash, 32 KiB of RAM), stay safe when something goes wrong, update in the field, and
        be testable without risking the hardware.
      cards:
        - icon: bus
          title: The host expects a servo
          text: >-
            Doppelstep emulates the complete Control Table of an XM430-W350 (model 1020) and
            maps it onto the motor. An integration test drives the firmware with the official
            DynamixelSDK, the library under the ROS 2 driver, in the control loop of
            ros2_control: Sync Read and Sync Write at 100 Hz.
          tags: [Protocol 2.0, Control Table, ros2_control]
        - icon: wave
          title: A stepper needs a fast, safe current loop
          text: >-
            Stepper-C closes the phase current loop in a 20 kHz zero-latency interrupt.
            Comparators switch the gates off through the timer break input within 0.5 µs,
            software trips act inside the interrupt, and a self-test checks the bridge and
            the wiring before the first Torque Enable. Checked on the board with a real motor.
          tags: [20 kHz, Hardware break, Self-test]
        - icon: flask
          title: Hardware is slow and costly to test on
          text: >-
            The same firmware runs on a PC with a physical model of the motor and the power
            stage. 110 automated tests run on every CI build in a pinned Docker image.
          tags: [native_sim, Software-in-the-loop, GitHub Actions]
    offer:
      eyebrow: What you get
      title: One repository, from the timer register to ROS 2
      intro: >-
        Three Zephyr drivers, an application that owns the threads, an out-of-tree board,
        a bootloader, a simulated motor, a bench GUI and a reproducible environment: a
        complete firmware product that you can build on.
      cards:
        - icon: layers
          title: Real Zephyr drivers
          text: >-
            A power-stage driver class, the motor behind Zephyr's stepper and stepper_ctrl
            APIs, and the servo as a child node of its UART. The devicetree selects the
            hardware.
          tags: [Devicetree, Kconfig, Layer rules in CI]
          link: architecture/
        - icon: monitor
          title: Simulated motor
          text: >-
            The plant model of Stepper-Lab with power stage values from ngspice, on the board
            or on the PC, so motion, protocol and ROS 2 work before a motor is connected.
          tags: [Plant model, ngspice, native_sim]
          link: simulation/
        - icon: lock
          title: Signed firmware update
          text: >-
            MCUboot checks an RSA-2048 signature at every start and accepts new firmware over
            the DYNAMIXEL bus itself. The GUI verifies the result by its SHA-256 hash. The
            release images use the public development key: sign a product with your own.
          tags: [MCUboot, Serial recovery, Signed images]
          link: firmware-update/
        - icon: gauge
          title: Bench GUI
          text: >-
            Motion with live plots and CSV recording, the whole Control Table, the SIL test
            scenarios on the real board with an HTML report, and the firmware update.
          tags: [Python, Live plots, Test reports]
          link: gui/
        - icon: chip
          title: Portable by design
          text: >-
            Only one backend file per MCU family touches registers. A fixed-point backend
            covers cores without an FPU; the next family is already analysed.
          tags: [One backend per MCU, Fixed point, Cortex-M0+]
          link: porting/
        - icon: check
          title: Reproducible environment
          text: >-
            Pinned versions, a Docker image published for CI and GitHub Codespaces, a Dev
            Container, and the same VS Code tasks on Windows and Linux.
          tags: [Docker, Dev Container, Codespaces]
          link: development/
    stats:                                   # measured values only (CI build of this version)
      - {value: "110", label: automated tests per CI run}
      - {value: "20 kHz", label: current control loop}
      - {value: "77.7 KiB", label: application flash}
      - {value: "18.7 KiB", label: application RAM}
    portfolio:
      title: Part of an open-source embedded portfolio
      text: >-
        Doppelstep is developed by Anton Vynohradov under SystemFromScratch®: secure
        embedded systems and compliance-ready engineering, from concept to
        certification-ready product. It shows on one real product how the company builds
        every layer: drivers, bootloader, control, protocol, tests and documentation.
      buttons:
        - {text: SystemFromScratch®, link: "https://systemfromscratch.com/", style: primary}
        - {text: About the author, link: about/, style: outline}
    trademark: >-
      SystemFromScratch® is a registered trademark. The Apache License 2.0 grants no rights
      to use the SystemFromScratch® name or logo; they may not be used to endorse or promote
      products derived from Doppelstep without prior written permission. DYNAMIXEL and
      ROBOTIS are trademarks of
      ROBOTIS Co., Ltd.; STM32 is a registered trademark of STMicroelectronics International
      N.V. Doppelstep is not affiliated with or endorsed by them.

extra_css:
  - assets/stylesheets/extra.css

hooks:
  - tools/docs/hooks.py      # captioned figures from plain Markdown images

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: Contents
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
