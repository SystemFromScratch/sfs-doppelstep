#
# Doppelstep application configuration.

# --- Libraries (Zephyr module glue in apps/modules) --------------------------
CONFIG_SSTEP=y
CONFIG_SSTEP_MATH_FLOAT=y
CONFIG_SSTEP_TOPOLOGY_FULL_BRIDGE=n
CONFIG_SSTEP_TOPOLOGY_SHARED_LEG=y

CONFIG_SFS_DYNAMIXEL_X430=y
CONFIG_X430_MODEL_XM430_W350=y
CONFIG_X430_MAX_DEVICES=1
CONFIG_X430_SIMULATOR=n

# --- Cortex-M4F: FPU in threads and in the fast-loop interrupt ---------------
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Fast loop (ADC end of sequence) above the kernel's interrupt locking
CONFIG_ZERO_LATENCY_IRQS=y

# --- Peripherals -------------------------------------------------------------
CONFIG_OPAMP=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- Persistent EEPROM area of the emulated DYNAMIXEL ------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- Console and logging over RTT (USART2 is the DYNAMIXEL bus) --------------
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# --- Debugging: thread awareness for OpenOCD / J-Link ------------------------
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=2048
