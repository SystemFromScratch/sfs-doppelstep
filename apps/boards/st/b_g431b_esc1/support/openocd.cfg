#
# B-G431B-ESC1: STM32G431CB behind the on-board ST-LINK/V2-1 (SWD, original
# ST firmware). Used by `west flash|debug|debugserver|attach -r openocd` and
# by scripts/host/openocd-server.* when OpenOCD runs on the host.
#
# Same interface/target setup as OpenOCD's board/st_nucleo_g4.cfg. Reset is
# done through SYSRESETREQ (reset_config none): it works whether or not the
# daughterboard ST-LINK drives NRST.

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32g4x.cfg]

reset_config none

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
