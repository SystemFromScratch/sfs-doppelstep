#
# Docker without VS Code:
#   docker compose build
#   docker compose run --rm zephyr bash scripts/west-init.sh      # first time
#   docker compose run --rm zephyr                                # build apps/doppelstep
#   docker compose run --rm zephyr-usb west flash -r openocd      # USB probe (usbipd)

x-zephyr: &zephyr
  image: doppelstep:1.0.1
  build:
    context: .
  working_dir: /workdir/doppelstep
  volumes:
    - west:/workdir
    - .:/workdir/doppelstep
  environment:
    CCACHE_DIR: /workdir/.ccache
    ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    ZEPHYR_SDK_INSTALL_DIR: /opt/zephyr-sdk
    BOARD: b_g431b_esc1

services:

  zephyr:
    <<: *zephyr
    command:
      - west
      - build
      - -b
      - b_g431b_esc1
      - -s
      - apps/doppelstep
      - -d
      - build

  zephyr-usb:
    <<: *zephyr
    profiles: [usb]
    privileged: true
    volumes:
      - west:/workdir
      - .:/workdir/doppelstep
      - /dev/bus/usb:/dev/bus/usb
    command: ["bash"]

volumes:
  west:
    name: doppelstep-west
