common:
  platform_allow: native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags: doppelstep

tests:
  doppelstep.drivers.sstep_motor: {}
  doppelstep.drivers.sstep_motor.selftest:
    extra_configs:
      - CONFIG_SSTEP_MOTOR_SELFTEST=y
  doppelstep.drivers.sstep_motor.mcuviewer:
    extra_configs:
      - CONFIG_SSTEP_MOTOR_MCUVIEWER=y
  doppelstep.drivers.sstep_motor.deadtime:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=deadtime.overlay
  doppelstep.drivers.sstep_motor.full_bridge:
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=full_bridge.overlay
  doppelstep.drivers.sstep_motor.full_bridge.selftest:
    extra_configs:
      - CONFIG_SSTEP_MOTOR_SELFTEST=y
    extra_args:
      - EXTRA_DTC_OVERLAY_FILE=full_bridge.overlay
